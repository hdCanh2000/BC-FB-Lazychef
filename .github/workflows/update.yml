name: Cap nhat du lieu FB Ads

on:
  schedule:
    - cron: "17 7 * * *"   # 14:00 gio Viet Nam moi ngay
  workflow_dispatch:       # cho phep bam chay thu bang tay

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cai thu vien
        run: pip install gspread google-auth

      - name: Lay du lieu FB Ads, ghi vao Google Sheet va xuat data.json
        env:
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          FB_AD_ACCOUNT_ID: ${{ secrets.FB_AD_ACCOUNT_ID }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python fetch_data.py

      - name: Luu data.json vao kho
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "Cap nhat du lieu"
          git push
